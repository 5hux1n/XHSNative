name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      THEOS: ${{ github.workspace }}/.toolchain/theos
      THEOS_REV: 958fea4f779943505b15b93c88bb4db8d97b346d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache Theos
        id: theos
        uses: actions/cache@v4
        with:
          path: .toolchain/theos
          key: theos-${{ runner.os }}-${{ runner.arch }}-${{ env.THEOS_REV }}

      - name: Get Theos
        if: steps.theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          ref: ${{ env.THEOS_REV }}
          path: .toolchain/theos
          submodules: recursive
          persist-credentials: false

      - name: Build dylib
        run: |
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version"
          grep -Eq '^Xcode 27([.]|$)' "$RUNNER_TEMP/xcode-version"
          make -j"$(sysctl -n hw.ncpu)" TARGET_CODESIGN=codesign TARGET_CODESIGN_FLAGS="-s -"
          xcrun lipo packages/XHSNative.dylib -verify_arch arm64

      - uses: actions/upload-artifact@v4
        with:
          name: XHSNative
          path: packages/XHSNative.dylib
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: XHSNative

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" XHSNative.dylib --clobber
          else
            gh release create "$TAG" XHSNative.dylib --verify-tag --title "$TAG" --generate-notes
          fi
